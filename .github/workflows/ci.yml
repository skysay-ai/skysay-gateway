#
# OpenPhonex Gateway — public-repo CI (gateway-only). This is the CI that ships
# in the PUBLIC export; it builds and tests ONLY the two first-party packages
# with the control plane absent, proving the self-containment guarantee.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ffmpeg (optional realtime transcode runtime dependency)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install packages (base — no heavy local-model extras)
        run: |
          python -m pip install --upgrade pip
          pip install ./packages/openphonex-common ./packages/openphonex-gateway
      - name: Import-light guarantee (no control plane on PYTHONPATH)
        run: python -c "import openphonex_gateway, openphonex_common"
      - name: Run gateway test suite
        run: python -m unittest discover -s tests

  spdx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Assert SPDX headers on first-party sources
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          roots = [Path("packages/openphonex-gateway/openphonex_gateway"),
                   Path("packages/openphonex-common/openphonex_common")]
          missing = []
          for root in roots:
              for p in root.rglob("*.py"):
                  if "SPDX-License-Identifier" not in p.read_text(encoding="utf-8"):
                      missing.append(str(p))
          if missing:
              print("Missing SPDX headers:")
              print("\n".join(missing))
              sys.exit(1)
          print("SPDX OK")
          PY
