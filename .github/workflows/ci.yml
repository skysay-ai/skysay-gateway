#
# Skysay Gateway — public-repo CI (gateway-only). This is the CI that ships
# in the PUBLIC export; it builds and tests ONLY the two first-party packages
# with the control plane absent, proving the self-containment guarantee.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install first-party packages
        run: |
          python -m pip install --upgrade pip
          pip install ./packages/skysay-common ./packages/skysay-gateway
          # The voice worker's listening mix (livekit_agent/livekit_evidence.py),
          # imported by its tests; the version the worker image pins.
          pip install numpy==2.5.3
      - name: Import-light guarantee (no control plane on PYTHONPATH)
        run: python -c "import skysay_gateway, skysay_common"
      - name: Run gateway test suite
        run: python -m unittest discover -s tests

  spdx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Assert SPDX headers on first-party sources
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          roots = [Path("packages/skysay-gateway/skysay_gateway"),
                   Path("packages/skysay-common/skysay_common")]
          missing = []
          for root in roots:
              for p in root.rglob("*.py"):
                  if "SPDX-License-Identifier" not in p.read_text(encoding="utf-8"):
                      missing.append(str(p))
          if missing:
              print("Missing SPDX headers:")
              print("\n".join(missing))
              sys.exit(1)
          print("SPDX OK")
          PY
