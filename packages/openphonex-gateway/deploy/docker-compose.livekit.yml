#
# OpenPhonex Gateway — LiveKit self-host stack. This mirrors the
# PRODUCTION OpenPhonex voice box: the same agent code, the same pinned
# component versions (tag AND digest), the same host-networking topology, and
# the same per-call config resolution through the OpenPhonex control plane
# (prepare_inbound -> realtime-config; see SELFHOST.md).
#
#   services: redis + livekit-server + livekit-sip + agents + reconciler
#             (+ profile-gated `outbound-worker`, `registrar`, and one-shot
#              `provision`)
#
# Quickstart (full runbook: SELFHOST.md; step-by-step: repo-root INSTALL.md):
#   cp livekit.yaml.example livekit.yaml       # fill in your LiveKit API key pair
#   cp sip.yaml.example sip.yaml               # the SAME key pair
#   cp .env.livekit.example .env.livekit       # control-plane + provider creds
#   cp .env.registrar.example .env.registrar   # sidecar creds; leave the core four
#                                              # blank unless you need registration mode
#   mkdir -p sessions call-evidence && sudo chown -R 10001:10001 sessions call-evidence
#   docker compose -f docker-compose.livekit.yml up -d --build
#   docker compose -f docker-compose.livekit.yml --profile provision run --rm provision
#   bash selfhost-smoketest.sh                 # PASS/FAIL verification; PASS = call-ready
#
# The agent image builds from the production build context at
# ../../../livekit_agent (the runtime module subset of the production agent,
# byte-identical file-for-file — export tests enforce parity — with a minimal
# public Dockerfile). Override LIVEKIT_AGENT_CONTEXT to point the build at a
# different context directory if you keep the agent sources elsewhere.
#
# NEVER commit the filled-in livekit.yaml / sip.yaml / .env.livekit — the
# export manifest excludes them and the secret scanner refuses .env files.

name: openphonex-livekit-selfhost

services:
  redis:
    # Same pin as the production voice box.
    image: redis:8.8.0-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    command: [redis-server, --bind, 127.0.0.1, --port, "6380", --save, "", --appendonly, "no"]
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, -h, 127.0.0.1, -p, "6380", ping]
      interval: 1s
      timeout: 1s
      retries: 30

  livekit:
    # Matches the production voice box as of 2026-08-11 (verified against the
    # running container, not against another file in this repo). Nothing here
    # enforces that: the production compose file is untracked, so this pin can
    # drift again silently. Re-verify before claiming parity.
    image: livekit/livekit-server:v1.13.5@sha256:3497163e15c48fef6e7830c78716f9e9d5edc28abf7aa90b61c86e93bbc306b1
    command: [--config, /run/sch236/livekit.yaml]
    network_mode: host
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./livekit.yaml
        target: /run/sch236/livekit.yaml
        read_only: true
    depends_on:
      redis:
        condition: service_healthy

  sip:
    # Same pin as the production voice box (livekit-sip v1.7.0).
    image: livekit/sip:v1.7.0@sha256:55d0882d4c3549d1c6b975cc1139d75a6d17cd5b4b5f7edbb9e9b4185ec351e7
    network_mode: host
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./sip.yaml
        target: /sip/config.yaml
        read_only: true
    depends_on:
      livekit:
        condition: service_started
      redis:
        condition: service_healthy

  agents:
    # The PRODUCTION agent: same code, same Dockerfile, same entrypoint. The
    # entrypoint sources /run/sch172/carrier.env (your .env.livekit) and drops
    # privileges to the unprivileged `agent` user before exec.
    build:
      context: ${LIVEKIT_AGENT_CONTEXT:-../../../livekit_agent}
      dockerfile: agent/Dockerfile
    image: openphonex-livekit-agent:selfhost
    entrypoint: [/app/carrier-entrypoint.sh]
    command: [python, /app/production_agent.py, start]
    user: "0:0"
    network_mode: host
    restart: unless-stopped
    environment:
      SCH236_SESSION_ROOT: /sessions
      SCH236_CALL_EVIDENCE_ROOT: /call-evidence
      # The self-host worker baseline intentionally excludes the global
      # worker_jobs:* heartbeat surface. Production retains its default-on
      # release/readiness heartbeat; this deployment disables it explicitly.
      OPENPHONEX_WORKER_HEARTBEAT_ENABLED: "0"
    volumes:
      - type: bind
        source: ./.env.livekit
        target: /run/sch172/carrier.env
        read_only: true
      - type: bind
        source: ./sessions
        target: /sessions
      - type: bind
        source: ./call-evidence
        target: /call-evidence
    depends_on:
      livekit:
        condition: service_started

  reconciler:
    # Orphan/crash reconciliation: closes stale sessions against the control
    # plane so a killed agent can never leave dangling billed minutes. No
    # `build:` here: it reuses the image `agents` builds (same Dockerfile,
    # same tag). A second build: block on this tag raced the agents build on
    # `docker compose up -d --build` and failed with "image ... already
    # exists".
    image: openphonex-livekit-agent:selfhost
    pull_policy: never   # image is built by the `agents` service; never try to pull it (works on Compose < 2.13 too)
    entrypoint: [/app/carrier-entrypoint.sh]
    command: [python, /app/reconcile_sessions.py]
    user: "0:0"
    network_mode: host
    restart: unless-stopped
    environment:
      SCH236_SESSION_ROOT: /sessions
      SCH236_RECONCILE_STALE_SECONDS: "15"
      OPENPHONEX_WORKER_HEARTBEAT_ENABLED: "0"
    volumes:
      - type: bind
        source: ./.env.livekit
        target: /run/sch172/carrier.env
        read_only: true
      - type: bind
        source: ./sessions
        target: /sessions
    depends_on:
      livekit:
        condition: service_started

  outbound-worker:
    # The outbound originator, in both of its shapes.
    #
    # As a SERVICE (`--profile outbound`, the `--watch` command below) it is the
    # legacy queue originator: it claims policy-approved
    # call.outbound_originate jobs an organization-scoped key requested, then
    # dials. Profile-gated so an inbound-only deployment never starts it by
    # accident.
    #
    # As a ONE-SHOT (`docker compose run --rm outbound-worker python
    # /app/outbound_worker.py originate --to +... --purpose ... --reason ...`)
    # it is the local originator for a deployment whose
    # outbound_execution_mode is `local`: it asks the control plane to admit
    # the call and dials it with the single-use token that returns, using only
    # the deployment-bound gateway token. `docker compose run` does NOT apply
    # profiles, so that path enforces OPENPHONEX_EXECUTE_LIVEKIT_OUTBOUND
    # itself rather than relying on this line.
    #
    # Both shapes consume the destination-bound single-use authorization before
    # any media, dial through LiveKit SIP, and explicitly dispatch the
    # production agent.
    profiles: [outbound]
    image: openphonex-livekit-agent:selfhost
    pull_policy: never
    entrypoint: [/app/carrier-entrypoint.sh]
    command: [python, /app/outbound_worker.py, --watch]
    user: "0:0"
    network_mode: host
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./.env.livekit
        target: /run/sch172/carrier.env
        read_only: true
    depends_on:
      agents:
        condition: service_started
      sip:
        condition: service_started

  registrar:
    # OPTIONAL registering SIP sidecar — the self-host path for a host with NO
    # reachable public address (home/office NAT, dynamic IP, CGNAT). It
    # REGISTERs outbound to your carrier, holds that NAT pinhole open with a
    # cheap keepalive, and proxies the carrier's INVITE to livekit-sip on
    # loopback. It is a SIP PROXY, not a media element: RTP still flows
    # directly between the carrier and livekit-sip, so the media path is
    # byte-for-byte the one a public-IP deployment uses.
    #
    # Profile-gated and ADDITIVE: it listens on its own port (5062 by default)
    # and forwards to livekit-sip's normal 5060, so `sip.yaml` and every other
    # service are untouched. A public-IP deployment simply never starts it.
    #   docker compose -f docker-compose.livekit.yml --profile registrar up -d
    # See SELFHOST.md "Choosing your inbound topology".
    profiles: [registrar]
    build:
      context: ./registrar
    image: openphonex-sip-registrar:selfhost
    network_mode: host
    restart: unless-stopped
    # Its OWN credential file, deliberately not .env.livekit. env_file passes
    # the whole file — Docker cannot filter it — and this is the most exposed
    # process in the stack: host-networked, parsing SIP off the internet.
    # Handing it the control-plane tokens and provider keys would turn a bug in
    # a SIP parser into a full credential compromise. Dropping to an
    # unprivileged uid does not help; a process can always read its own environ.
    env_file:
      - ./.env.registrar
    # A lapsed registration is silent: the process keeps running, the carrier
    # may keep showing the endpoint as registered for a while, and calls simply
    # stop arriving. The check is a script in the image rather than an inline
    # command because getting it right is subtle -- Kamailio reuses its expiry
    # field as a retry deadline, so the obvious "is it non-zero" test reports
    # healthy throughout a total registration failure. See healthcheck.sh.
    healthcheck:
      test: ["CMD", "/usr/local/bin/openphonex-registrar-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      sip:
        condition: service_started

  provision:
    # One-shot LiveKit SIP bootstrap (inbound trunk + dispatch rule for your
    # DID). Profile-gated: run it once after the stack is up, and again only
    # when the DID / carrier allowlist changes:
    #   docker compose -f docker-compose.livekit.yml --profile provision run --rm provision
    profiles: [provision]
    # No `build:` here either — it reuses the image `agents` builds; see the
    # reconciler comment above.
    image: openphonex-livekit-agent:selfhost
    pull_policy: never   # image is built by the `agents` service; never try to pull it (works on Compose < 2.13 too)
    entrypoint: [/app/carrier-entrypoint.sh]
    command: [python, /app/provision_selfhost.py]
    user: "0:0"
    network_mode: host
    restart: "no"
    # The provisioner needs the SIP_REGISTRATION_* block to know which topology
    # to provision: registration mode creates the trunk WITHOUT an address
    # allowlist, because with the sidecar in front every INVITE arrives from
    # this host. Without these it would provision a carrier allowlist that
    # rejects every real call.
    #
    # This direction is safe and the reverse is not: the provisioner already
    # holds every control-plane credential, so also giving it the sidecar's
    # config grants nothing new. The registrar must still never be handed
    # .env.livekit.
    #
    # Short form on purpose. The `required: false` long form is Compose 2.24+,
    # and an older Compose rejects the WHOLE file at parse time -- which would
    # stop a public-IP deployment that never touches this profile from starting
    # at all. Measured on 2.23.3. Instead .env.registrar is created by every
    # deployment (blank for a public-IP host), so it is always there to read.
    env_file:
      - ./.env.registrar
    volumes:
      - type: bind
        source: ./.env.livekit
        target: /run/sch172/carrier.env
        read_only: true
    depends_on:
      livekit:
        condition: service_started
      sip:
        condition: service_started
