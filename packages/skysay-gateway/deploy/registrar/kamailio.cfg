#!KAMAILIO
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 Unigox OÜ
#
# Skysay Gateway — registering SIP sidecar (SIP proxy, NOT a B2BUA).
#
# ROLE, and nothing else:
#   1. REGISTER outbound to the carrier, refreshed, so the carrier knows where
#      to send calls for a host that has no reachable public address.
#   2. Send a cheap OPTIONS keepalive on the SAME socket so the NAT/conntrack
#      binding created by (1) never expires between registration refreshes.
#      Carriers commonly enforce a long minimum registration interval (DIDWW's
#      Min-Expires is 600s) while NAT UDP bindings die in 30-120s, so the
#      registration by itself CANNOT hold the pinhole open. This keepalive is
#      what makes the feature work.
#   3. Accept INVITEs from the carrier ONLY, and proxy them to the local
#      livekit-sip. Media never touches this process: the SDP is relayed
#      untouched and RTP flows directly between the carrier and livekit-sip.
#
# All deployment-specific values arrive as substdefs rendered by entrypoint.sh
# from environment variables — no credential is ever written in this file.
#
# Placeholders are written __OPX_<NAME>__. The delimiters are not decoration: a
# substdef is a plain textual replacement over the whole config, so a bare
# token that happens to be a substring of another token — or of a rendered
# value — silently rewrites the wrong thing. That exact bug once turned the
# route name NATKEEPALIVE into NAT25 and stopped the keepalive firing, with no
# error anywhere. The __OPX_...__ form cannot occur inside an IP, hostname or
# credential, which makes that whole failure class structurally impossible;
# entrypoint.sh rejects the marker in any value, and an export test lints the
# token set. (Kamailio requires substdef tokens to be identifier-shaped, so
# `@`-delimited names are not an option: they fail to substitute at all and the
# config then dies with an opaque parse error.)
include_file "/run/skysay-registrar/defines.cfg"

####### Global Parameters #########
debug=__OPX_LOGLEVEL__
log_stderror=yes
log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "
fork=yes
children=2
auto_aliases=no
# Drop privileges after the socket is bound. Everything below this point parses
# carrier-controlled SIP on a host-networked process, so it must not be root.
# entrypoint.sh chowns the runtime directory to the same user beforehand.
user="kamailio"
group="kamailio"
# Bind the ONE interface address that reaches the carrier. A wildcard bind
# would put 0.0.0.0 in our own Via, which no registrar can answer — and it
# would expose this proxy on every other interface of the host, including a
# global IPv6 address that has no NAT in front of it.
listen=udp:__OPX_LOCAL_IP__:__OPX_LISTEN_PORT__

####### Modules #########
loadmodule "jsonrpcs.so"
loadmodule "ctl.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "uac.so"
loadmodule "db_text.so"
loadmodule "permissions.so"
loadmodule "rtimer.so"

# The control socket lives in the runtime dir; the registration record is
# injected over it at startup instead of being written to a file, so the
# carrier password never lands on disk.
modparam("ctl", "binrpc", "unix:/run/skysay-registrar/kamailio_ctl")
modparam("jsonrpcs", "pretty_format", 1)
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 5000)
modparam("tm", "fr_inv_timer", 60000)
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)

# --- the carrier allowlist (db_text `address` table, rendered from env) ------
modparam("permissions", "db_url", "text:///run/skysay-registrar/db")
modparam("permissions", "db_mode", 1)

# --- outbound registration ----------------------------------------------------
# The registrant subsystem only initialises when a db_url is configured, so a
# db_text directory is supplied — but the uacreg table ships EMPTY and the one
# record is added over the control socket at startup (see entrypoint.sh).
modparam("uac", "reg_db_url", "text:///run/skysay-registrar/db")
modparam("uac", "reg_timer_interval", 60)
modparam("uac", "reg_retry_interval", 30)
modparam("uac", "reg_keep_callid", 1)
modparam("uac", "reg_random_delay", 0)
modparam("uac", "reg_active", 1)
# Kamailio requires an explicit Contact address for the registrant. Behind an
# ordinary NAT the reachable address is unknown, so this defaults to the local
# socket and the carrier is relied on to use the source it observed
# (rport/received). Operators with a port-forward or 1:1 NAT set
# SIP_REGISTRATION_CONTACT_ADDRESS and it is advertised verbatim instead.
modparam("uac", "reg_contact_addr", "__OPX_CONTACT_ADDR__")

# --- NAT keepalive timer ----------------------------------------------------
modparam("rtimer", "timer", "name=natka;interval=__OPX_KEEPALIVE_SECS__;mode=1;")
modparam("rtimer", "exec", "timer=natka;route=NAT_PING")

####### Routing #########
request_route {
	if(!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}
	if(!sanity_check("1511", "7")) {
		xlog("L_WARN", "malformed request from $si:$sp - dropped\n");
		exit;
	}

	# THE SOURCE GATE. It must come before EVERYTHING, in-dialog requests
	# included. An earlier revision gated only out-of-dialog requests, which
	# left the has_totag()/loose_route() path open: anyone able to reach this
	# socket could present a To tag and a crafted Route set and be relayed to
	# an arbitrary next hop. That is an open relay, and on an
	# endpoint-independent NAT anyone who finds the mapped port can reach this
	# socket -- which is the deployment this sidecar is built for. Do not move
	# a routing decision above this block.
	#
	# Two legs are legitimate: the carrier (group 1) and the local livekit-sip
	# (group 2, pinned to its address AND its port).
	if(allow_source_address("1")) {
		$var(leg) = 1;   # carrier
	} else if(allow_source_address("2")) {
		$var(leg) = 2;   # local livekit-sip
	} else {
		xlog("L_WARN", "$rm from unauthorised source $si:$sp - rejected\n");
		sl_send_reply("403", "Forbidden");
		exit;
	}

	# Everything in an established dialog follows the Route set we inserted.
	if(has_totag()) {
		if(loose_route()) {
			if($var(leg) == 1) {
				# Pin the next hop. Having popped our own Route, whatever the
				# far side put in the rest of the Route set (or in the R-URI)
				# is NOT trusted to name a destination: there is exactly one
				# local endpoint and in-dialog traffic from the carrier always
				# goes there. This also sidesteps livekit-sip advertising its
				# STUN-discovered external address in Contact, which is not
				# reachable from inside the NAT.
				$du = "sip:__OPX_TARGET__";
			} else {
				# Local leg heading outward: the next hop must actually BE the
				# carrier, so a compromised or confused local process cannot
				# use this proxy to reach anything else.
				if($du == "") {
					$var(nexthop) = $rd;
				} else {
					$var(nexthop) = $dd;
				}
				if(!allow_address("1", "$var(nexthop)", "0")) {
					xlog("L_WARN", "in-dialog $rm from local leg to non-carrier next hop $var(nexthop) - rejected\n");
					sl_send_reply("403", "Forbidden");
					exit;
				}
			}
			if(!t_relay()) {
				sl_reply_error();
			}
		} else if(is_method("ACK")) {
			if(t_check_trans()) {
				t_relay();
			}
		} else {
			sl_send_reply("404", "Not Found");
		}
		exit;
	}

	if(is_method("CANCEL")) {
		if(t_check_trans()) {
			t_relay();
		}
		exit;
	}
	t_check_trans();

	# Only the carrier may open a NEW dialog into this stack. The local leg is
	# a callee, never an originator, through this proxy.
	if($var(leg) != 1) {
		xlog("L_WARN", "out-of-dialog $rm from the local leg $si:$sp - rejected\n");
		sl_send_reply("403", "Forbidden");
		exit;
	}

	# Carrier health checks terminate here; they are not calls. A carrier's
	# registrar qualifies the endpoint this way every few minutes.
	if(is_method("OPTIONS")) {
		sl_send_reply("200", "OK");
		exit;
	}

	# This proxy exists to carry calls INTO one local endpoint. It is not a
	# registrar, not a redirect server, and relays nothing else.
	if(!is_method("INVITE")) {
		sl_send_reply("405", "Method Not Allowed");
		exit;
	}

	# Stay in the signalling path for the whole dialog so in-dialog requests
	# (BYE, re-INVITE) from either side come back through the pinhole.
	#
	# This deliberately advertises THIS HOST's own address even when a public
	# one is known. The carrier routes in-dialog requests to the source address
	# it observed — verified on live calls — so a public Record-Route buys
	# nothing on that leg, while it would force the LOCAL leg's in-dialog
	# requests (an agent-side BYE) to hairpin back in through the router, which
	# many consumer routers refuse to do. Advertising the local address keeps
	# both legs on the path that is actually proven to work.
	record_route();

	# Same user part (the called number), local destination. livekit-sip sees
	# this host's own address as the source, not the carrier's — which is why
	# the trunk provisioned for registration mode carries no address allowlist
	# and THIS proxy is the source-filtering boundary (see SELFHOST.md).
	$du = "sip:__OPX_TARGET__";
	xlog("L_INFO", "inbound call $rU from $si:$sp -> $du\n");
	if(!t_relay()) {
		sl_reply_error();
	}
	exit;
}

# Behind NAT our own Via carries a private address the carrier cannot route a
# response to, so every locally generated request (the REGISTER and the
# keepalive below) must ask for rport. Verified against a live carrier: without
# it the registrar answers into the void and the registration never completes.
event_route[tm:local-request] {
	add_local_rport();
}

# The registration refresh interval a carrier permits (DIDWW: >= 600s) is far
# longer than a NAT UDP binding lives, so poke the same socket periodically.
# This is the difference between "registration is up" and "calls arrive".
#
# The Call-ID is deliberately constant across pings. These are independent
# one-shot transactions rather than a dialog, and each carries its own fresh
# branch, so reuse is harmless — and it makes the keepalive trivial to pick out
# in a packet capture.
route[NAT_PING] {
	$uac_req(method) = "OPTIONS";
	$uac_req(ruri) = "sip:__OPX_REGISTRAR__";
	$uac_req(furi) = "sip:__OPX_REG_AOR__";
	$uac_req(turi) = "sip:__OPX_REG_AOR__";
	$uac_req(callid) = "__OPX_KEEPALIVE_CALLID__";
	$var(ka) = uac_req_send();
	xlog("L_DBG", "nat keepalive OPTIONS rc=$var(ka)\n");
}
