;
; OpenPhonex Gateway — dialplan. Inbound provider calls are handed to the
; Stasis app "voicebot" (the OpenPhonex realtime worker attaches ExternalMedia
; over ARI). This file contains NO secrets — it is the non-secret call-routing
; interface between the provider trunk and the gateway worker.

[general]
static=yes
writeprotect=no
clearglobalvars=no

[from-provider]
exten => _X.,1,NoOp(Inbound provider call to ${EXTEN})
 same => n,Answer()
 same => n,Stasis(voicebot,inbound)
 same => n,Hangup()
exten => s,1,NoOp(Inbound provider call to s)
 same => n,Answer()
 same => n,Stasis(voicebot,inbound)
 same => n,Hangup()
exten => _.,1,NoOp(Inbound provider call to arbitrary RURI ${EXTEN})
 same => n,Answer()
 same => n,Stasis(voicebot,inbound)
 same => n,Hangup()

[outbound]
; Dial through the trunk-outbound endpoint using its AOR contact (which points
; at the provider host). Keeping the host out of the dialplan means this file
; carries no ${ENV} secrets — only Asterisk's own ${EXTEN} variable.
exten => _X.,1,NoOp(Outbound call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@trunk-outbound,60)
 same => n,Hangup()
exten => _+X.,1,NoOp(Outbound call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@trunk-outbound,60)
 same => n,Hangup()
