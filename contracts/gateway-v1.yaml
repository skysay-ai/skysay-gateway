# SPDX-License-Identifier: Apache-2.0
# OpenPhonex Gateway API v1 contract
#
# The public contract between a self-hosted gateway and the OpenPhonex
# control plane. Operations are marked `x-status: stable` (the frozen v1
# surface, a backwards-compatibility guarantee) or `x-status: proposed`
# (additive, not yet implemented). Request/response bodies for stable
# operations are published as JSON Schemas in contracts/schemas/*.json.
openapi: 3.1.0
info:
  title: OpenPhonex Gateway API
  version: 1.0.0
  summary: Contract between external/self-hosted gateways and the OpenPhonex control plane.
  description: |
    ## Scope

    This contract covers the surface a self-hosted gateway uses to talk to the
    OpenPhonex Cloud control plane:

    * gateway-deployment registration and health reporting,
    * worker-job enqueue,
    * trial-call inbound routing,
    * phone-server CRUD and Number Rules objects,
    * the audio contract (`pcm_s16le_8000_mono`),
    * call artifact import (multipart upload).

    ## Authentication

    Every authenticated route uses a bearer token presented as
    `Authorization: Bearer <token>`. Principals carry a scope list; a scope
    check passes when the principal holds `*`, the exact scope, or the
    `<namespace>:*` wildcard.

    An inbound self-hosted stack uses ONE credential, sent as
    `Authorization: Bearer`: the scoped **per-gateway token** (`tgw_...`,
    `OPENPHONEX_GATEWAY_API_TOKEN`). It covers gateway-deployment operations —
    health/lifecycle reporting, number-rules sync, realtime-config reads and
    artifact upload — plus inbound call routing and MCP `tools/list` schema
    discovery. The organization it acts in is derived server-side from the
    token, never from the request body, and `tools/list` is the only MCP method
    it may call.

    An **organization-scoped worker token** (`OPENPHONEX_WORKER_API_TOKEN`) is
    still accepted where an install sets one, and is required by the optional
    outbound-dial profile. Protect it: it carries organization-wide authority
    (see SECURITY.md). Rotate either token via the token endpoints on
    compromise.

    ## Audio contract

    The media-plane audio protocol is **`pcm_s16le_8000_mono`**: 16-bit signed
    little-endian PCM frames, 8000 Hz sample rate, single channel. Gateway
    media workers MUST produce and consume this format; there is no negotiation
    mechanism.
  x-sections:
    as_built: Documents current behavior exactly; conformance-tested.
    proposed: Additive design proposals; not implemented.

servers:
  - url: https://api.openphonex.com
    description: OpenPhonex Cloud control plane.
  - url: http://127.0.0.1:8765
    description: Local development server.

tags:
  - name: as-built
    description: >-
      AS-BUILT surface. Every operation tagged as-built is implemented
      exactly as described and is covered by the contract conformance tests.
  - name: proposed-additive
    description: >-
      PROPOSED-ADDITIVE surface. NOT IMPLEMENTED. Additive changes for the
      gateway contract (per-gateway tokens, narrowed scopes, ETag Number-Rules
      sync, multipart artifact upload, routing_mode, SIP trunk descriptor).

security:
  - orgApiKey: []

paths:
  # =========================================================================
  # AS-BUILT
  # =========================================================================
  /v1/gateway-deployments:
    post:
      tags: [as-built]
      x-status: stable
      operationId: createGatewayDeployment
      summary: Register a gateway deployment
      description: |
        Auth today: org API key with scope `gateways:write`; payload `organization_id` must
        match the caller's organization (operators exempt). Applies suspension and risk
        checks; hosted modes also check the `hosted_gateway` scope of suspensions and the
        per-organization active hosted-deployment cap (the `hosted_gateway_deployments`
        risk-controls velocity cap; plan default when unset). gateway deployments
        carry no fee, so creation never charges the wallet (the legacy `charge_wallet`
        flag was removed with the component price book). A provider account is
        auto-attached. Self-hosted
        deployments start as `awaiting_connection` with docker-compose instructions;
        hosted ones as `active` with a generated `public_url`.
      x-required-scopes: ["gateways:write"]
      x-json-schema:
        request: contracts/schemas/gateway_deployment_create_request.json
        response: contracts/schemas/gateway_deployment.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayDeploymentCreateRequest"
      responses:
        "201":
          description: Gateway deployment created (fully enriched resource, including pricing).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDeployment"
        default:
          $ref: "#/components/responses/Error"
    get:
      tags: [as-built]
      x-status: stable
      operationId: listGatewayDeployments
      summary: List gateway deployments for an organization
      description: |
        Scope `gateways:read`. `organization_id` query parameter is checked against the
        principal. NOTE (as-built): list rows are enriched with `gateway_health` but do
        NOT include the `pricing` object that single-resource GET adds.
        `gateway_health.status` is `connected` once the control plane has observed this
        deployment's own `tgw_` token authenticate (`gateway_health.control_plane_last_seen_at`,
        derived from `gateway_tokens.last_used_at`). A self-hosted gateway posts no
        health report, so its readiness comes from that outbound contact, not from
        health-check artefacts; an explicitly FAILED check still overrides it.
      x-required-scopes: ["gateways:read"]
      parameters:
        - $ref: "#/components/parameters/organizationId"
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Array of gateway deployments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GatewayDeployment"
        default:
          $ref: "#/components/responses/Error"

  /v1/gateway-deployments/{gateway_id}:
    get:
      tags: [as-built]
      x-status: stable
      operationId: getGatewayDeployment
      summary: Get one gateway deployment
      description: |
        Scope `gateways:read`; response organization must match the principal
        (`send_scoped_json`). Adds `provider_account`, `deployment_model` and a
        `pricing` estimate to the row.
      x-required-scopes: ["gateways:read"]
      parameters:
        - $ref: "#/components/parameters/gatewayId"
      responses:
        "200":
          description: Gateway deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDeployment"
        default:
          $ref: "#/components/responses/Error"

  /v1/gateway-deployments/{gateway_id}/health-report:
    post:
      tags: [as-built]
      x-status: stable
      operationId: postGatewayHealthReport
      summary: Post a gateway health report (self-hosted doctor)
      description: |
        Auth today: org API key with scope `gateways:write` (same scope
        as registration - there is no narrower reporting scope yet; see proposed
        `gateways:report`). The report is stored verbatim as `last_health_status`; the
        server derives `status` / `next_step` from EXPLICIT check FAILURES (api_health,
        media_health, voice_gateway_health, realtime_worker_health, storage) plus the
        last test result and observed gateway-token contact, and writes an audit event
        `gateway.health_reported`. An absent check is "no evidence" and never blocks
        readiness - the production self-host package ships no health-report producer.
        Returns the full updated deployment resource.
      x-required-scopes: ["gateways:write"]
      x-json-schema:
        request: contracts/schemas/gateway_health_report_request.json
        response: contracts/schemas/gateway_deployment.json
      parameters:
        - $ref: "#/components/parameters/gatewayId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayHealthReportRequest"
      responses:
        "200":
          description: Updated gateway deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDeployment"
        default:
          $ref: "#/components/responses/Error"

  /v1/gateway-deployments/{gateway_id}/call-lifecycle-events:
    post:
      tags: [as-built]
      x-status: stable
      operationId: postGatewayCallLifecycleEvent
      summary: Record authoritative SIP/room lifecycle for one call
      description: |
        A gateway token may report only for its own deployment and organization.
        Event ids are idempotent. SIP/room timestamps, rather than worker-declared
        duration or artifact metadata, drive terminal call state and voice billing.
        `sip.failed` releases the reservation; `sip.ended` and
        `session.reconciled` settle from the stored call-event timeline.
      x-required-scopes: ["gateways:report"]
      x-json-schema:
        request: contracts/schemas/gateway_call_lifecycle_event_request.json
        response: contracts/schemas/gateway_call_lifecycle_event_response.json
      parameters:
        - $ref: "#/components/parameters/gatewayId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayCallLifecycleEventRequest"
      responses:
        "201":
          description: Lifecycle event recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayCallLifecycleEventResponse"
        "200":
          description: Idempotent replay of an already-recorded event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayCallLifecycleEventResponse"
        default:
          $ref: "#/components/responses/Error"

  /v1/gateway-deployments/{gateway_id}/outbound-calls:
    post:
      tags: [as-built]
      x-status: stable
      operationId: originateGatewayOutboundCall
      summary: Admit an outbound call this deployment will dial itself
      description: |
        For a self-hosted deployment whose `outbound_execution_mode` is `local`.
        The control plane runs the SAME outbound admission a remote
        `POST /v1/calls` runs -- the outbound authorization decision, the wallet
        reserve, the call record and the bounded execution slot -- and then, in
        place of enqueueing a `call.outbound_originate` worker job, mints the
        single-use `tca_` call authorization bound to
        (gateway, organization, from-number, to-number, call) and returns it
        with a dial plan.

        The organization and project come from the verified gateway deployment
        row, never from this body: a named `organization_id` or `project_id`
        may only AGREE with them. The caller ID may be named as an E.164
        `from_phone_number` (resolved inside that project) or as a
        `from_number_id`; either way it must be an active number of the
        deployment's own project.

        Because there is no job to retry, this route refuses BEFORE the wallet
        reserve when live calling is disabled. A refused authorization returns
        `authorized: false` with no token, and a replayed `idempotency_key`
        returns the original call with no token -- re-issuing a media token
        without a fresh authorization decision would bypass policy.

        A deployment in the default `queue` mode is refused here; its calls are
        placed from the worker queue as before. Conversely, once an organization
        has a `local`-mode deployment and no `queue`-mode deployment left, a
        remote `POST /v1/calls` for its numbers fails closed rather than
        enqueueing a job nothing would claim. Job claims are per-organization,
        so one remaining queue-mode deployment keeps every project working, and
        the mode switch itself is refused in either direction while calls are
        still in flight rather than abandoning them.
      x-required-scopes: ["calls:authorize"]
      x-json-schema:
        request: contracts/schemas/gateway_outbound_call_request.json
        response: contracts/schemas/gateway_outbound_call_response.json
      parameters:
        - $ref: "#/components/parameters/gatewayId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayOutboundCallRequest"
      responses:
        "201":
          description: Admission ran. `authorized` says whether a token was minted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayOutboundCallResponse"
        default:
          $ref: "#/components/responses/Error"

  /v1/worker-jobs:
    post:
      tags: [as-built]
      x-status: stable
      operationId: enqueueWorkerJob
      summary: Enqueue a worker job
      description: |

        **Operator-tier caveat (honest as-built statement).** The required scope today
        is `worker_jobs:write`, which is the same scope used by the internal worker
        fleet for `claim`, `complete`, `fail`, `retry`, `execute` and worker
        heartbeats. It is effectively an infrastructure-tier credential:

        * `kind` is a free-form string; there is NO kind allowlist.
        * `POST /v1/worker-jobs/claim` with the same scope and NO `organization_id`
          claims the oldest queued job of ANY organization
          (`require_organization_access` skips the check when organization_id is
          empty; `claim_worker_job`).
        * `GET /v1/worker-heartbeats` under `worker_jobs:read` is not org-scoped.

        Handing `worker_jobs:write` to a customer-hosted gateway therefore over-grants
        cross-tenant queue access. That is why the proposed section defines a
        kind-allowlisted, org-pinned `worker_jobs:enqueue` scope. Until then, external
        gateways should not be issued `worker_jobs:write` keys in production.
      x-required-scopes: ["worker_jobs:write"]
      x-json-schema:
        request: contracts/schemas/worker_job_create_request.json
        response: contracts/schemas/worker_job.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerJobCreateRequest"
      responses:
        "201":
          description: Queued worker job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerJob"
        default:
          $ref: "#/components/responses/Error"

  /v1/trial-calls/route:
    post:
      tags: [as-built]
      x-status: stable
      operationId: routeTrialInboundCall
      summary: Route an inbound trial call by PIN
      description: |
        Scope `trial_calls:write`. Looks up the newest trial call whose
        `pin` matches and whose status is ready/ringing/media_started, then completes it
        via `_complete_trial_inbound_call` (): creates an inbound
        call_session, emits `trial.pin_matched`, and either simulates media
        (`media_started`, demo artifacts) or - with `live_media=true` - enqueues a
        `call.inbound_bridge` worker job gated by the LiveKit call gates
        (`OPENPHONEX_LIVE_CALLS_ENABLED` + `OPENPHONEX_VOICE_LIVE_ENABLED`). Returns the trial-call
        resource with `call_id`/`call` attached and status `succeeded`.
      x-required-scopes: ["trial_calls:write"]
      x-json-schema:
        request: contracts/schemas/trial_call_route_request.json
        response: contracts/schemas/trial_call.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrialCallRouteRequest"
      responses:
        "200":
          description: Trial call after routing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrialCall"
        default:
          $ref: "#/components/responses/Error"

  /v1/phone-servers:
    post:
      tags: [as-built]
      x-status: stable
      operationId: createPhoneServer
      summary: Create a phone server (customer SIP destination)
      description: |
        Scope `numbers:write`. Customer concept "Phone server" maps internally to
        DIDWW voice-in trunk SIP destination / voice-out trunk allowed_sip_ips.
        Raw SIP passwords are never persisted - only a `password_reference` pointer.
      x-required-scopes: ["numbers:write"]
      x-json-schema:
        request: contracts/schemas/phone_server_create_request.json
        response: contracts/schemas/phone_server.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneServerCreateRequest"
      responses:
        "201":
          description: Phone server created (verification_status not_tested).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneServer"
        default:
          $ref: "#/components/responses/Error"
    get:
      tags: [as-built]
      x-status: stable
      operationId: listPhoneServers
      summary: List phone servers
      description: |
        Scope `numbers:read`. With `project_id`, also returns org-wide servers whose
        project_id is NULL.
      x-required-scopes: ["numbers:read"]
      parameters:
        - $ref: "#/components/parameters/organizationId"
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Array of phone servers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PhoneServer"
        default:
          $ref: "#/components/responses/Error"

  /v1/phone-servers/{phone_server_id}:
    get:
      tags: [as-built]
      x-status: stable
      operationId: getPhoneServer
      summary: Get one phone server
      description: "Scope `numbers:read`."
      x-required-scopes: ["numbers:read"]
      parameters:
        - $ref: "#/components/parameters/phoneServerId"
      responses:
        "200":
          description: Phone server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneServer"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [as-built]
      x-status: stable
      operationId: updatePhoneServer
      summary: Update a phone server
      description: |
        Scope `numbers:write`. Any update resets `verification_status` to `not_tested`
        (the server must be re-tested before number rules may route to it).
      x-required-scopes: ["numbers:write"]
      x-json-schema:
        request: contracts/schemas/phone_server_update_request.json
        response: contracts/schemas/phone_server.json
      parameters:
        - $ref: "#/components/parameters/phoneServerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneServerUpdateRequest"
      responses:
        "200":
          description: Updated phone server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneServer"
        default:
          $ref: "#/components/responses/Error"

  /v1/phone-servers/{phone_server_id}/test:
    post:
      tags: [as-built]
      x-status: stable
      operationId: testPhoneServer
      summary: Verify a phone server (dry-run)
      description: |
        Scope `numbers:write`. AS-BUILT: this is a dry-run verification -
        `network_call_performed` is always false; it checks presence of
        server_address/sip_uri, marks the server `active`/`verified`, and records the
        result. A live SIP OPTIONS probe is explicitly deferred behind operator
        approval. Returns the updated phone-server resource.
      x-required-scopes: ["numbers:write"]
      parameters:
        - $ref: "#/components/parameters/phoneServerId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
      responses:
        "200":
          description: Verified phone server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneServer"
        default:
          $ref: "#/components/responses/Error"

  /v1/numbers/{number_id}/number-rules:
    get:
      tags: [as-built]
      x-status: stable
      operationId: getNumberRules
      summary: Get Number Rules for a number
      description: |
        Scope `numbers:read`. Alias path (same handler): `/v1/phone-numbers/{number_id}/number-rules`.
        Returns the newest active number_routes row, or a derived default
        (status `derived_default`) when none exists.
      x-required-scopes: ["numbers:read"]
      x-json-schema:
        response: contracts/schemas/number_rules.json
      parameters:
        - $ref: "#/components/parameters/numberId"
      responses:
        "200":
          description: Number rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberRules"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [as-built]
      x-status: stable
      operationId: updateNumberRules
      summary: Update Number Rules for a number
      description: |
        Scope `numbers:write`. Alias path: `/v1/phone-numbers/{number_id}/number-rules`.
        Sections merge over current rules; the previous route row is superseded and a
        route_changes audit row is written. `send_to_my_phone_server` requires a
        verified phone server in the same workspace.
      x-required-scopes: ["numbers:write"]
      x-json-schema:
        request: contracts/schemas/number_rules_update_request.json
        response: contracts/schemas/number_rules.json
      parameters:
        - $ref: "#/components/parameters/numberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NumberRulesUpdateRequest"
      responses:
        "200":
          description: Updated number rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberRules"
        default:
          $ref: "#/components/responses/Error"

  /v1/call-artifact-imports:
    post:
      tags: [as-built]
      x-status: stable
      operationId: importCallArtifacts
      summary: Import call artifacts from a local path (SAME-HOST-ONLY, deprecated for external gateways)
      description: |
        Scope `recordings:write`.

        **SAME-HOST-ONLY / DEPRECATED-FOR-EXTERNAL-GATEWAYS.** `source_path` is
        resolved on the API server's own filesystem. This works for the co-located
        worker (`call.artifact_import` jobs) and local demos, but an external gateway
        on another machine cannot deliver artifacts through it. External gateways
        should NOT build on this endpoint; the replacement is the proposed multipart
        upload endpoint (`POST /v1/calls/{call_id}/artifacts`, x-status: proposed).

        Behavior: imports one or many artifact sets (wav/mp3/... + transcript.json +
        latency.json + waveform.json), stores objects under `imports/{call_id}/...`,
        creates/updates call_sessions, call_recordings, call_artifacts and call_turns,
        and is idempotent per content-hash `provider_call_id`.
      x-required-scopes: ["recordings:write"]
      x-json-schema:
        request: contracts/schemas/call_artifact_import_request.json
        response: contracts/schemas/call_artifact_import_result.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallArtifactImportRequest"
      responses:
        "201":
          description: Import result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallArtifactImportResult"
        default:
          $ref: "#/components/responses/Error"

  # =========================================================================
  # AS-BUILT: per-gateway tokens, rotation, Number-Rules ETag
  # sync, and multipart artifact upload. (The proposed-additive SIP trunk
  # descriptor schema remains proposed; see components/schemas below.)
  # =========================================================================
  /v1/gateway-deployments/{gateway_id}/tokens:
    post:
      tags: [as-built]
      x-status: stable
      operationId: issueGatewayToken
      summary: "AS-BUILT: issue a per-gateway token at registration"
      description: |
        Issues a machine credential bound to one gateway deployment,
        replacing the practice of copying an org API key onto the gateway host.
        Token principal properties: pinned `organization_id` and `gateway_id`; scopes
        restricted to the proposed gateway scope set (`gateways:report`,
        `worker_jobs:enqueue`, `artifacts:upload`, `number-rules:read`); secret shown
        once at issuance. Issuance itself requires an org key with `gateways:write`
        (or an operator). Expected to be called once by the dashboard/CLI during
        registration and stored on the gateway as `OPENPHONEX_GATEWAY_API_TOKEN`
        (the env var already referenced by the self-hosted install plan).
      x-required-scopes: ["gateways:write"]
      parameters:
        - $ref: "#/components/parameters/gatewayId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scopes:
                  type: array
                  description: Subset of the proposed gateway scope set; defaults to all four.
                  items:
                    type: string
                    enum: ["gateways:report", "worker_jobs:enqueue", "artifacts:upload", "number-rules:read"]
                expires_in_days:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: Token issued (secret returned once).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposedGatewayToken"
        default:
          $ref: "#/components/responses/Error"

  /v1/gateway-deployments/{gateway_id}/tokens/rotate:
    post:
      tags: [as-built]
      x-status: stable
      operationId: rotateGatewayToken
      summary: "AS-BUILT: rotate the per-gateway token"
      description: |
        Issues a replacement token and starts a grace window
        (default 24h) during which both old and new tokens verify, so a fleet can
        roll without downtime. Callable by the current gateway token itself
        (self-rotation) or an org key with `gateways:write`. Old token is revoked at
        the end of the grace window and the rotation is audit-logged.
      x-required-scopes: ["gateways:write OR current gateway token"]
      parameters:
        - $ref: "#/components/parameters/gatewayId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                grace_seconds:
                  type: integer
                  minimum: 0
                  default: 86400
      responses:
        "201":
          description: New token issued; previous token enters grace window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposedGatewayToken"
        default:
          $ref: "#/components/responses/Error"

  /v1/gateway-deployments/{gateway_id}/number-rules:
    get:
      tags: [as-built]
      x-status: stable
      operationId: syncGatewayNumberRules
      summary: "AS-BUILT: ETag-cached Number-Rules sync for a gateway"
      description: |
        Returns the active Number Rules for every number currently
        routed through this gateway's organization, as one document with a strong
        `ETag` (hash of the newest route_changes id set). Gateways poll with
        `If-None-Match`; an unchanged rule set answers `304 Not Modified` with no
        body, making frequent polling cheap. Requires the proposed
        `number-rules:read` scope (gateway token) - today a gateway would need the
        much broader `numbers:read`.
      x-required-scopes: ["number-rules:read"]
      parameters:
        - $ref: "#/components/parameters/gatewayId"
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Full rules document (ETag header set).
          headers:
            ETag:
              schema:
                type: string
              description: Strong validator over the rule set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  gateway_id:
                    type: string
                  generated_at:
                    type: string
                  number_rules:
                    type: array
                    items:
                      $ref: "#/components/schemas/NumberRules"
                required: [gateway_id, generated_at, number_rules]
        "304":
          description: Not modified; caller's cached copy is current.
        default:
          $ref: "#/components/responses/Error"

  /v1/calls/{call_id}/artifacts:
    post:
      tags: [as-built]
      x-status: stable
      operationId: uploadCallArtifact
      summary: "AS-BUILT: multipart artifact upload (replaces same-host source_path imports for external gateways)"
      description: |
        Streams call artifacts (recordings, transcript.json,
        latency.json, waveform.json) from an external gateway over HTTPS instead of
        requiring a shared filesystem. multipart/form-data with one `file` part per
        artifact plus a `metadata` JSON part (kind, label, relative_path,
        sha256). Server stores parts under `imports/{call_id}/...` and reuses the
        as-built import pipeline (recording selection, waveform, transcript turns).
        Audio parts MUST be `pcm_s16le_8000_mono` WAV unless the metadata declares a
        codec explicitly. Idempotency: per-part sha256; a re-uploaded identical part
        is acknowledged without duplication. Requires the proposed `artifacts:upload`
        scope pinned to the gateway's organization.
      x-required-scopes: ["artifacts:upload"]
      parameters:
        - name: call_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                metadata:
                  type: string
                  description: JSON string; per-file entries keyed by part name.
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "201":
          description: Artifacts stored and attached to the call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallArtifactImportResult"
        default:
          $ref: "#/components/responses/Error"

  /v1/calls/{call_id}/realtime-config:
    get:
      tags: [as-built]
      x-status: stable
      operationId: getOutboundCallRealtimeConfig
      summary: Resolve the authoritative realtime config for an authorized outbound call
      description: |
        The production media agent calls this after the LiveKit originator has
        consumed the call's single-use, destination-bound authorization. A
        gateway token may read only calls in its organization and only when the
        consumed authorization belongs to that same gateway. The response
        merges the selected agent with the call's bounded instructions,
        first-message, and language overrides. No prompt or bearer credential
        needs to travel through SIP, participant attributes, or room metadata.
      x-required-scopes: ["gateways:report"]
      x-json-schema:
        response: contracts/schemas/call_realtime_config.json
      parameters:
        - name: call_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Effective, call-bound production voice configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallRealtimeConfig"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    orgApiKey:
      type: http
      scheme: bearer
      description: |
        AS-BUILT: organization API key (`tapi_...`) or dashboard session token as
        `Authorization: Bearer <token>`. Scope semantics: `*`, exact
        match, or `<namespace>:*`.

        PROPOSED (x-status: proposed, NOT IMPLEMENTED): per-gateway tokens issued at
        registration with the narrowed scope set below.
      x-as-built-scopes-used-by-gateways:
        - "gateways:read"
        - "gateways:write"
        - "worker_jobs:write (operator-tier today; see POST /v1/worker-jobs caveat)"
        - "trial_calls:write"
        - "numbers:read"
        - "numbers:write"
        - "recordings:write"
      x-proposed-scopes:
        gateways:report: >-
          PROPOSED. Post health reports for the token's own gateway only. Strictly
          narrower than gateways:write (cannot register/modify deployments).
        worker_jobs:enqueue: >-
          PROPOSED. Enqueue-only, org-pinned, KIND-ALLOWLISTED worker-job scope.
          Default allowlist for gateways: call.artifact_import, call.inbound_route,
          gateway.health_probe. No claim/complete/fail/retry rights, unlike today's
          worker_jobs:write.

          AS-BUILT ADDITION: the `call.inbound_route` allowlist entry, together
          with this scope, is also what admits a gateway token to
          `POST /v1/calls/inbound/route` and to the call-bound
          `GET /v1/calls/{call_id}/realtime-config` for the resulting INBOUND
          call. The organization is taken from the token row, never from the
          request body, and an outbound call still requires a consumed
          single-call authorization. Minting a token whose kind_allowlist omits
          `call.inbound_route` is therefore how an operator stops one
          deployment answering calls without touching the rest of the
          workspace.

          A gateway token is additionally admitted to `POST /mcp` for the
          `tools/list` method ONLY (the static tool catalogue; no workspace row
          is read). Every other MCP method, `tools/call` included, is refused.
        artifacts:upload: >-
          PROPOSED. Upload artifacts to calls in the token's organization via the
          multipart endpoint. No read access to other recordings.
        number-rules:read: >-
          PROPOSED. Read-only Number Rules sync (ETag endpoint) without the broader
          numbers:read surface.

